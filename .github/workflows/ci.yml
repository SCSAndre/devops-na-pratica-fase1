name: Pipeline de Integracao Continua (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Testes e Validacao IaC
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do codigo
        uses: actions/checkout@v4

      - name: 2. Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Executar testes automatizados
        run: npm test

      - name: 4. Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: 5. Validar scripts de IaC (Terraform)
        working-directory: ./infra
        run: |
          terraform init -backend=false
          terraform fmt -check
          terraform validate
