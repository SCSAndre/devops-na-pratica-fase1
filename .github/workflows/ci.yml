name: Pipeline CI/CD e DevSecOps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/scsandre/devops-na-pratica-fase1

jobs:
  ci-build-and-test:
    name: 1. CI - Testes Automatizados e Validacao IaC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Executar testes unitarios e de integracao
        run: npm test

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validar scripts de IaC (Terraform)
        working-directory: ./infra
        run: |
          terraform init -backend=false
          terraform fmt -check
          terraform validate

  security-scan:
    name: 2. DevSecOps - Analise de Seguranca (Trivy)
    runs-on: ubuntu-latest
    needs: ci-build-and-test

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Scan de vulnerabilidades e IaC (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH,MEDIUM'
          format: 'table'
          exit-code: '0'

  cd-container-delivery:
    name: 3. CD - Build, Scan de Imagem e Publicacao GHCR
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build da imagem Docker
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:latest -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Scan de seguranca da imagem Docker (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Smoke test do container antes da publicacao
        run: |
          docker run -d --name smoke-test -p 3000:3000 ${{ env.IMAGE_NAME }}:latest
          sleep 3
          curl -fsS http://127.0.0.1:3000/health
          curl -fsS http://127.0.0.1:3000/metrics | head -n 5
          docker rm -f smoke-test

      - name: Publicar imagem versionada no GHCR
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
