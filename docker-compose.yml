services:
  app:
    build: .
    image: ghcr.io/scsandre/devops-na-pratica-fase1:latest
    container_name: monitor-saude-app
    ports:
      - "3000:3000"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: monitor-saude-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app
    restart: unless-stopped
