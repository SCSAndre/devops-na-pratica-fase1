apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-saude-app
  labels:
    app: monitor-saude
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monitor-saude
  template:
    metadata:
      labels:
        app: monitor-saude
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: ghcr.io/scsandre/devops-na-pratica-fase1:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
